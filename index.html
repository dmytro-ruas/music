<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Music Player</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link rel="stylesheet" href="music-player.css">
    </head>
    <body>
        <!-- <audio controls src="./jingle-bells.mp3"></audio> -->

        <div class="search-container">
            <input type="text" id="term" placeholder="type something"><br>
            <button onClick="searchiTunes(); clearBox()">Search</button>
        </div>

        <div id="song-grid-container" class="song-grid-container">



        </div>


        <div class="music-player">

        <div class="song-info">
            <img id="song-image" src="./album-art1.jpg"/>
            <div class="song-info-text">
                <div id="song-artist">Artist</div>
                <div id="song-name">Song</div>
            </div>
        </div>

            <div class="controls">
                <input id="slider-song" type="range">
                <div class="music-buttons">
                    <i id="shuffle-song" class="fa-solid fa-shuffle"></i>                
                    <i id="prev-song" class="fa-solid fa-backward-step fa-1.5x"></i>
                    <i id="playpause-song" class="fa-solid fa-circle-play fa-2x"></i>
                    <i id="next-song" class="fa-solid fa-forward-step fa-1.5x"></i>
                    <i id="repeat-song" class="fa-solid fa-repeat"></i>                
                </div>
            </div>

            </div>
        </div>

        <div class="audio-controls-container">

        </div>
        <script src="music-player.js"></script>
    </body>
</html>
